services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taupunkt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - taupunkt-db:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taupunkt
      APP_API_KEY: dev-key
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  taupunkt-db:
